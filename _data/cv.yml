  sections:
    Experience:
      - name: 10x Genomics
        position: Senior Scientist
        location: Pleasanton, CA
        url: https://www.10xgenomics.com/
        start_date: 2021-07
        end_date: present
        highlights:
          - "Visium HD spatial transcriptomics: worked in a tight loop with biologists on assay and protocol development, designing and optimizing metrics for sensitivity, specificity, and false-positive detection. Algorithms that extract spatial signal from data — effectively a 30,000-sparse-channel image — ship in Visium HD and run in production for every Visium HD customer."
          - "Production ML pipelines: led end-to-end development of ML models for cell-type annotation and nucleus segmentation — from data collection and labeling through training, evaluation, and production deployment — across all three 10x Genomics platforms: Visium, Xenium, and Chromium (single-cell)."
          - "Engineering infrastructure: own production-quality pipelines end-to-end within 10x Genomics' large shared codebase (primarily Python and Rust, also Go and C/C++), shipped in released software, with reproducible builds via Bazel."
          - "Agentic AI for single-cell workflows: building a tool-use agentic environment that automates single-cell analysis workflows, using eval-driven development to measure agent performance, correctness, and failure modes."
          - "Led a team of 3 ML scientists/engineers building ML algorithms from data collection through production."

