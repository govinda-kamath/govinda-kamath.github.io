cv:
  name: Govinda M. Kamath
  label: Senior Scientist, 10x Genomics
  location: Pleasanton, CA
  image: ""
  summary: >
    Applied ML researcher/engineer with 5+ years turning algorithms into production systems used
    by biologists and engineers, spanning fundamental academic research (PhD, Stanford) and biotech
    industry practice (10x Genomics). I work in tight collaboration with experimental biologists to
    design analyses and build pipelines they can depend on — across single-cell, spatial transcriptomics,
    and imaging platforms — with a career-long focus on making biological inference rigorous: avoiding
    false discoveries and building methods scientists can actually trust.

